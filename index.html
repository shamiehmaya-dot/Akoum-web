<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/akoum-logo.png" />
    <title>AKOUM</title>
    <style>
      #startup-loader {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 22px;
        background:
          radial-gradient(circle at 50% 42%, rgba(52, 126, 245, 0.24), transparent 34%),
          #0e0e0e;
        color: #fff;
        font: 600 15px system-ui, sans-serif;
        letter-spacing: 0.08em;
        transition: opacity 0.35s ease, visibility 0.35s ease;
      }

      #startup-loader.is-hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      #startup-loader img {
        display: block;
        width: min(190px, 48vw);
        height: auto;
        padding: 14px;
        border-radius: 24px;
        background: #fff;
        box-shadow: 0 0 44px rgba(52, 126, 245, 0.28);
        animation: startup-pulse 1.8s ease-in-out infinite;
      }

      #startup-loader span {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      #startup-loader span::before {
        width: 15px;
        height: 15px;
        border: 2px solid rgba(255, 255, 255, 0.24);
        border-top-color: #60d0f8;
        border-radius: 50%;
        content: "";
        animation: startup-spin 0.8s linear infinite;
      }

      @keyframes startup-spin {
        to { transform: rotate(360deg); }
      }

      @keyframes startup-pulse {
        50% { transform: translateY(-4px); }
      }

      @media (prefers-reduced-motion: reduce) {
        #startup-loader,
        #startup-loader img,
        #startup-loader span::before {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <div id="startup-loader" role="status" aria-live="polite">
      <img src="/akoum-logo.png" alt="AKOUM Tutoring Center" />
      <span>Loading AKOUM</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
